<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Nunito:wght@600;700&display=swap">
  <style>
    body { margin: 0; background: #FBF4E6; font-family: 'Nunito', 'Avenir Next', 'Segoe UI', sans-serif; color: #22262F; }
    a { color: #D9532B; } a:hover { color: #B8401E; }
    .display { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; font-weight: 700; }
    .grid { background-image: linear-gradient(#EADFCB 1px, transparent 1px), linear-gradient(90deg, #EADFCB 1px, transparent 1px); background-size: 24px 24px; }
    .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 46px; align-items: center; gap: 10px; border: 3px solid #22262F; background: #FFFFFF; padding: 10px 12px; }
    .bar { display: flex; flex-direction: row; height: 16px; border: 2px solid #22262F; overflow: hidden; }
    .bar span { flex-grow: 1; }
  </style>
</helmet>
<div class="grid" style="width: 390px; height: 844px; background-color: #FBF4E6; display: flex; flex-direction: column; gap: 0px; overflow: hidden; box-sizing: border-box; padding: 56px 16px 24px 16px;">

  <div style="display: flex; flex-direction: row; align-items: baseline; justify-content: space-between;">
    <span class="display" style="font-size: 20px; letter-spacing: 1px;">THIS WEEK</span>
    <span style="font-size: 13px; font-weight: 700; color: #7A7F8C;">4 of 7 days muggy or worse</span>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: row; align-items: center; gap: 12px; border: 3px solid #22262F; background: #FBD5E4; padding: 10px 12px; box-shadow: 6px 6px 0 #22262F;">
    <img src="cloud-oppressive.png" style="width: 64px; height: 66px; object-fit: contain; image-rendering: pixelated;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <span class="display" style="font-size: 18px;">STICKY STRETCH AHEAD</span>
      <span style="font-size: 13px; line-height: 1.4; font-weight: 600; color: #22262F;">Thursday is the one to plan around.</span>
    </div>
  </div>

  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px;">
    <div class="row"><span class="display" style="font-size: 17px;">TODAY</span><div class="bar"><span style="flex-grow: 7; background: #F5EFA8;"></span><span style="flex-grow: 9; background: #F6C6A8;"></span><span style="flex-grow: 3; background: #F79AC0;"></span><span style="flex-grow: 5; background: #F6C6A8;"></span></div><span class="display" style="font-size: 17px; text-align: right;">31°</span></div>
    <div class="row"><span class="display" style="font-size: 17px;">SAT</span><div class="bar"><span style="flex-grow: 6; background: #F5EFA8;"></span><span style="flex-grow: 12; background: #F6C6A8;"></span><span style="flex-grow: 6; background: #F5EFA8;"></span></div><span class="display" style="font-size: 17px; text-align: right;">30°</span></div>
    <div class="row"><span class="display" style="font-size: 17px;">SUN</span><div class="bar"><span style="flex-grow: 10; background: #CDE8B8;"></span><span style="flex-grow: 10; background: #F5EFA8;"></span><span style="flex-grow: 4; background: #CDE8B8;"></span></div><span class="display" style="font-size: 17px; text-align: right;">27°</span></div>
    <div class="row"><span class="display" style="font-size: 17px;">MON</span><div class="bar"><span style="flex-grow: 8; background: #DCE3EC;"></span><span style="flex-grow: 8; background: #CDE8B8;"></span><span style="flex-grow: 8; background: #F5EFA8;"></span></div><span class="display" style="font-size: 17px; text-align: right;">26°</span></div>
    <div class="row"><span class="display" style="font-size: 17px;">TUE</span><div class="bar"><span style="flex-grow: 5; background: #F5EFA8;"></span><span style="flex-grow: 9; background: #F6C6A8;"></span><span style="flex-grow: 10; background: #F79AC0;"></span></div><span class="display" style="font-size: 17px; text-align: right;">32°</span></div>
    <div class="row"><span class="display" style="font-size: 17px;">WED</span><div class="bar"><span style="flex-grow: 4; background: #F6C6A8;"></span><span style="flex-grow: 12; background: #F79AC0;"></span><span style="flex-grow: 8; background: #F6C6A8;"></span></div><span class="display" style="font-size: 17px; text-align: right;">33°</span></div>
    <div class="row"><span class="display" style="font-size: 17px;">THU</span><div class="bar"><span style="flex-grow: 3; background: #F79AC0;"></span><span style="flex-grow: 14; background: #F0755B;"></span><span style="flex-grow: 7; background: #F79AC0;"></span></div><span class="display" style="font-size: 17px; text-align: right;">35°</span></div>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px 12px;">
    <span class="display" style="display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: #4A4F5C;"><span style="width: 12px; height: 12px; border: 2px solid #22262F; background: #DCE3EC;"></span>dry</span>
    <span class="display" style="display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: #4A4F5C;"><span style="width: 12px; height: 12px; border: 2px solid #22262F; background: #CDE8B8;"></span>comfortable</span>
    <span class="display" style="display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: #4A4F5C;"><span style="width: 12px; height: 12px; border: 2px solid #22262F; background: #F5EFA8;"></span>humid</span>
    <span class="display" style="display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: #4A4F5C;"><span style="width: 12px; height: 12px; border: 2px solid #22262F; background: #F6C6A8;"></span>muggy</span>
    <span class="display" style="display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: #4A4F5C;"><span style="width: 12px; height: 12px; border: 2px solid #22262F; background: #F79AC0;"></span>oppressive</span>
    <span class="display" style="display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: #4A4F5C;"><span style="width: 12px; height: 12px; border: 2px solid #22262F; background: #F0755B;"></span>miserable</span>
  </div>

  <p style="margin: auto 0 0 0; font-size: 11px; font-weight: 600; color: #7A7F8C; text-align: center;">Bars show each hour's comfort band; the number is the day's high. Weather data by Open-Meteo.</p>
</div>
</x-dc>
</body>
</html>
