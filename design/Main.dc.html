<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Nunito:wght@600;700&display=swap">
  <style>
    body { margin: 0; background: #FBF4E6; font-family: 'Nunito', 'Avenir Next', 'Segoe UI', sans-serif; color: #22262F; }
    a { color: #D9532B; } a:hover { color: #B8401E; }
    .display { font-family: 'Space Grotesk', 'Avenir Next', sans-serif; font-weight: 700; }
    .grid { background-image: linear-gradient(#EADFCB 1px, transparent 1px), linear-gradient(90deg, #EADFCB 1px, transparent 1px); background-size: 24px 24px; }
  </style>
</helmet>
<div class="grid" style="width: 390px; height: 844px; background-color: #FBF4E6; display: flex; flex-direction: column; gap: 0px; overflow: hidden; box-sizing: border-box; padding: 56px 16px 24px 16px;">

  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: row; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D9532B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <span class="display" style="font-size: 24px; letter-spacing: 0.5px;">TIRANA</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A7F8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
    <div style="display: flex; flex-direction: row; border: 3px solid #22262F; background: #FFFFFF;">
      <span class="display" style="font-size: 15px; padding: 7px 14px; background: #22262F; color: #FBF4E6;">°C</span>
      <span class="display" style="font-size: 15px; padding: 7px 14px; border-left: 3px solid #22262F;">°F</span>
    </div>
  </div>

  <div style="margin-top: 20px; position: relative; border: 4px solid #22262F; background: #F6C6A8; box-shadow: 8px 8px 0 #22262F; height: 312px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <img src="cloud-muggy.png" style="width: 236px; height: 244px; object-fit: contain; image-rendering: pixelated;">
    <div style="position: absolute; left: -4px; bottom: -4px; display: flex; flex-direction: row; align-items: center; gap: 8px; border: 3px solid #22262F; background: #FFFFFF; padding: 6px 14px 6px 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22262F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .6-7.95A6 6 0 0 1 19 9a3.5 3.5 0 0 1-1 6.9"></path><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"></path></svg>
      <span class="display" style="font-size: 20px; letter-spacing: 1px;">MUGGY</span>
    </div>
    <span class="display" style="position: absolute; right: -4px; bottom: -4px; border: 3px solid #22262F; background: #FFFFFF; padding: 6px 12px; font-size: 15px;">now · 14:00</span>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 6px;">
    <h1 class="display" style="margin: 0; font-size: 34px; line-height: 1.05; letter-spacing: 0.5px;">IT'S MUGGY OUT</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; font-weight: 600; color: #4A4F5C;">The air is muggy. Shirts will stick a little — go light and find the shade.</p>
  </div>

  <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: 3px solid #22262F; background: #FFFFFF; padding: 10px 6px; box-shadow: 4px 4px 0 #22262F;"><span class="display" style="font-size: 13px; color: #7A7F8C;">TEMP</span><span class="display" style="font-size: 24px;">29°</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: 3px solid #22262F; background: #FFFFFF; padding: 10px 6px; box-shadow: 4px 4px 0 #22262F;"><span class="display" style="font-size: 13px; color: #7A7F8C;">HUMIDITY</span><span class="display" style="font-size: 24px;">78%</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; border: 3px solid #22262F; background: #F6C6A8; padding: 10px 6px; box-shadow: 4px 4px 0 #22262F;"><span class="display" style="font-size: 13px; color: #4A4F5C;">COMFORT</span><span class="display" style="font-size: 18px; letter-spacing: 0.5px;">MUGGY</span></div>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: row; align-items: baseline; justify-content: space-between;">
    <span class="display" style="font-size: 20px; letter-spacing: 1px;">NEXT HOURS</span>
    <span style="font-size: 13px; font-weight: 700; color: #7A7F8C;">stickiest around 17:00</span>
  </div>
  <div style="margin-top: 10px; display: flex; flex-direction: row; border: 3px solid #22262F; background: #FFFFFF; box-shadow: 6px 6px 0 #22262F; overflow: hidden;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: #F6C6A8; border-right: 2px solid #22262F; box-shadow: inset 0 -5px 0 #22262F;"><span class="display" style="font-size: 13px; color: #4A4F5C;">now</span><span class="display" style="font-size: 17px;">29°</span></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: #F6C6A8; border-right: 2px solid #22262F;"><span class="display" style="font-size: 13px; color: #4A4F5C;">15</span><span class="display" style="font-size: 17px;">30°</span></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: #F79AC0; border-right: 2px solid #22262F;"><span class="display" style="font-size: 13px; color: #4A4F5C;">16</span><span class="display" style="font-size: 17px;">31°</span></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: #F79AC0; border-right: 2px solid #22262F;"><span class="display" style="font-size: 13px; color: #4A4F5C;">17</span><span class="display" style="font-size: 17px;">31°</span></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: #F6C6A8; border-right: 2px solid #22262F;"><span class="display" style="font-size: 13px; color: #4A4F5C;">18</span><span class="display" style="font-size: 17px;">30°</span></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: #F5EFA8;"><span class="display" style="font-size: 13px; color: #4A4F5C;">19</span><span class="display" style="font-size: 17px;">27°</span></div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: row; justify-content: center;">
    <div style="display: flex; flex-direction: row; border: 3px solid #22262F; background: #FFFFFF; box-shadow: 6px 6px 0 #22262F;">
      <span class="display" style="font-size: 15px; padding: 9px 22px; background: #22262F; color: #FBF4E6;">CLOUD</span>
      <span class="display" style="font-size: 15px; padding: 9px 22px; border-left: 3px solid #22262F;">BOY</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
